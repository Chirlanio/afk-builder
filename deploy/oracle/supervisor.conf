; Worker da fila do afk-builder. O provision.sh substitui __APP_DIR__ e
; __APP_USER__ e grava em /etc/supervisor/conf.d/afk-builder.conf.
;
; O /admin/sync despacha RunArtisanCommandJob na fila `database`; sem este
; worker nenhum comando de sincronizacao sai do lugar.

[program:afk-builder-worker]
process_name=%(program_name)s_%(process_num)02d
directory=__APP_DIR__
; --tries=1 de proposito: os comandos de sync (heroes:sync, artifacts:sync...)
; escrevem no banco conforme raspam a wiki. Um retry automatico reprocessaria
; um sync parcial, entao a falha e registrada em command_runs e o retry fica a
; cargo do admin. O ReconcileCommandRunsCommand limpa runs orfaos.
; --timeout=1800 acompanha o valor usado no `composer dev` local.
command=/usr/bin/php __APP_DIR__/artisan queue:work database --queue=default --sleep=3 --tries=1 --timeout=1800 --max-time=3600
user=__APP_USER__
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Precisa ser maior que --timeout, senao o supervisor mata um sync em andamento
; durante um restart.
stopwaitsecs=1860
redirect_stderr=true
stdout_logfile=/var/log/afk-builder/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
