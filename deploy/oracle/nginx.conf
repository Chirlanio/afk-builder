# Template do vhost do afk-builder. O provision.sh substitui os placeholders
# __SERVER_NAME__, __APP_DIR__ e __PHP_V__ e grava em sites-available.
#
# Depois de rodar `certbot --nginx`, o proprio certbot injeta o bloco 443 e o
# redirect — nao edite este arquivo a mao no servidor, edite aqui e re-rode o
# trecho de nginx do provision.sh.

server {
    listen 80;
    listen [::]:80;

    server_name __SERVER_NAME__;
    root __APP_DIR__/public;

    index index.php;
    charset utf-8;

    # Import de roster por screenshot (OCR) sobe imagens grandes.
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets do Vite: o nome do arquivo carrega o hash do conteudo, entao
    # cache imutavel e seguro — a cada build o nome muda.
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php__PHP_V__-fpm-afk-builder.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # Alguns comandos do /admin/sync respondem sincronamente antes de
        # cair na fila; 300s evita 504 no primeiro clique.
        fastcgi_read_timeout 300;
    }

    # Bloqueia dotfiles, exceto o desafio do certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    access_log /var/log/nginx/afk-builder.access.log;
    error_log  /var/log/nginx/afk-builder.error.log;
}
